# Front door for the web terminal.
#
# ttyd has no access control of its own, and the add-on sits on the shared
# hassio Docker network, so binding it to 0.0.0.0 let every other add-on open
# an unauthenticated root shell here. ttyd now listens on loopback only, and
# this proxy accepts nothing but the Supervisor's Ingress gateway (which has
# already authenticated the HA user) and the in-container health check.

worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 64;
}

http {
    access_log off;
    server_tokens off;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 7681 default_server;

        # Supervisor Ingress gateway
        allow 172.30.32.2;
        # HEALTHCHECK
        allow 127.0.0.1;
        deny  all;

        location / {
            proxy_pass http://127.0.0.1:7682;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
        }
    }
}
